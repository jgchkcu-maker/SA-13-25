[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ak-schedule-bot"
version = "1.0.0"
description = "Telegram schedule changes for СА-13-25"
requires-python = ">=3.12"
dependencies = [
  "Telethon==1.45.0",
  "google-genai==2.31.0",
  "cryptography==50.0.2",
  "httpx==0.28.1",
  "pydantic>=2.11,<3",
  "python-dotenv>=1.1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=1,<2", "ruff>=0.11,<1"]

[project.scripts]
schedule-bot = "schedule_bot.cli:main"

[tool.setuptools.packages.find]
include = ["schedule_bot*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

